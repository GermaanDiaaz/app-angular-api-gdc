<section class="card" style="max-width: 320px">
    <div class="card-body">
        <h4 class="card-title">{{vehicle()?.name}}</h4>
        <p class="card-text">({{vehicle()?.model}})</p>
        <p class="card-text">({{vehicle()?.manufacturer}})</p>

        <button type="button" class="btn-solid " (click)="emitVehicleClicked()">Ver detalles</button>
    </div>
</section>
