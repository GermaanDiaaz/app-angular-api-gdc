<div class="modal-header">
    <h4 class="modal-title">Detalles del Vehiculo</h4>
</div>
<div class="modal-body">
    <h3>Nombre: {{ vehicle()?.name }}</h3>
    <p>Modelo: {{ vehicleDetail?.model}}</p>
    <p>Manufacturado: {{ vehicleDetail?.manufacturer}}</p>
    <p>Coste: {{ vehicleDetail?.cost_in_credits}}</p>
    <p>Longuitud: {{ vehicleDetail?.length}}</p>
    <p>Crew: {{ vehicleDetail?.crew}}</p>
    <p>Pasajeros: {{ vehicleDetail?.passengers}}</p>
</div>
